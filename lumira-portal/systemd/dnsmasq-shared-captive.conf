# LUMIRA – Captive-Portal-DNS für den Setup-Access-Point.
#
# Wird von install.sh nach /etc/NetworkManager/dnsmasq-shared.d/ kopiert.
# NetworkManager startet für jede "shared" (Access-Point-)Verbindung
# automatisch eine eigene dnsmasq-Instanz und liest dabei Zusatzoptionen aus
# diesem Ordner. Die Wildcard-Regel sorgt dafür, dass JEDE DNS-Anfrage im
# Setup-WLAN auf den Pi selbst zeigt – iOS/Android erkennen das WLAN dadurch
# als "ohne Internet" und öffnen von selbst die Anmeldeseite (Captive
# Portal), siehe concept/selfservice.md Abschnitt 3+7.
#
# Achtung: gilt für JEDE shared-Verbindung auf diesem Gerät – auf einem
# LUMIRA-Pi (kein Allzweck-Router) ist das gewünscht.
address=/#/192.168.4.1
